<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found | Edmar Lindo</title>
    <meta name="description" content="404 — the page you are looking for does not exist on this site." />
    <meta name="theme-color" content="#111111" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root { color-scheme: dark; }
      html { background: #111111; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .card {
        padding: 44px 58px;
        border-radius: 18px;
        border: 1px solid rgba(214, 214, 214, 0.14);
        background: #1c1c1c;
        text-align: center;
        max-width: 460px;
      }
      h1 {
        font-size: 56px;
        margin: 0 0 10px;
        color: #d6d6d6;
      }
      p {
        font-size: 15px;
        line-height: 1.6;
        color: #9b9b9b;
        margin: 0 0 24px;
      }
      a.button {
        display: inline-block;
        padding: 11px 26px;
        border-radius: 10px;
        background: #d6d6d6;
        color: #111111;
        font: 700 14px/1 sans-serif;
        text-decoration: none;
      }
      a.button:focus-visible { outline: 2px solid #f5f5f3; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>404</h1>
      <p>The page you are looking for doesn&rsquo;t exist or has moved.</p>
      <a class="button" href="/">Back to home</a>
    </main>
  </body>
</html>
